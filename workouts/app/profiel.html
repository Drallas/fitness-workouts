<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="prof.title">Profile</title>
<meta name="description" content="Your name and photo in the training app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
.pic { display: flex; align-items: center; gap: 12px; }
.pic .big { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--soft); color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 36px; border: 2px solid var(--line); flex: 0 0 auto; }
.pic .big img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap">
  <header class="stack">
    <div class="eyebrow" data-i18n="brand">Ferro Fitness</div>
    <h1 data-i18n="prof.h1">Profile</h1>
  </header>

  <section class="card">
    <div class="pic">
      <div class="big" id="big"></div>
      <div class="stack" style="gap:6px">
        <label class="btn small" for="photo" style="cursor:pointer" data-i18n="prof.pick">Choose photo</label>
        <input type="file" id="photo" accept="image/*" hidden>
        <button class="btn small danger" id="rmphoto" type="button" data-i18n="prof.remove">Remove photo</button>
      </div>
    </div>
    <p class="note" data-i18n="prof.photoNote">The photo is shrunk on your device and stored there. It never leaves your phone or computer.</p>
  </section>

  <section class="card">
    <div class="field">
      <label for="name" data-i18n="prof.name">Name</label>
      <input type="text" id="name" maxlength="40" autocomplete="name">
    </div>
    <div class="row">
      <button class="btn primary" id="save" type="button" data-i18n="prof.save">Save</button>
      <span class="note" id="msg" role="status"></span>
    </div>
  </section>
</div>

<script type="module">
import { renderNav } from "./nav.js";
import { loadProfile, saveProfile } from "./stats.js";
import { initPage, t } from "./i18n.js";

initPage();
renderNav("profiel");
const $ = (id) => document.getElementById(id);
let profile = loadProfile();

function show() {
  $("name").value = profile.name || "";
  const initials = (profile.name || "A").trim().slice(0, 1).toUpperCase();
  $("big").innerHTML = profile.photo ? `<img src="${profile.photo}" alt="">` : initials;
}

// Verkleinen tot 256 px, als JPEG: klein genoeg om lokaal te bewaren.
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = 256 / Math.min(img.width, img.height);
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      const sw = 256 / s, sx = (img.width - sw) / 2, sy = (img.height - sw) / 2;
      ctx.drawImage(img, sx, sy, sw, sw, 0, 0, 256, 256);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

$("photo").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    profile.photo = await shrink(f);
    saveProfile(profile);
    show();
    $("msg").textContent = t("prof.photoSaved");
    renderNav("profiel");
  } catch (err) { $("msg").textContent = t("prof.photoErr"); }
});

$("rmphoto").addEventListener("click", () => {
  delete profile.photo;
  saveProfile(profile);
  show();
  renderNav("profiel");
  $("msg").textContent = t("prof.photoRemoved");
});

$("save").addEventListener("click", () => {
  profile.name = $("name").value.trim();
  saveProfile(profile);
  show();
  renderNav("profiel");
  $("msg").textContent = t("prof.saved");
});

show();
</script>
</body>
</html>
